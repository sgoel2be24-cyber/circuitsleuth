name: Verify CircuitSleuth

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: |
          python -m pip install -r backend/requirements.lock.txt
          npm --prefix frontend ci
      - name: Verify backend, frontend and MCP
        run: python scripts/verify_local.py --include-mcp
      - name: Build deployable image
        run: docker build -f deploy/Dockerfile -t circuitsleuth:ci .
      - name: Verify container HTTP inspection and evidence
        run: |
          docker run -d --name circuitsleuth-check -p 127.0.0.1:8080:8080 circuitsleuth:ci
          python tools/http_smoke_test.py --base-url http://127.0.0.1:8080
          python -m tools.export_demo_evidence --out /tmp/circuitsleuth-demo-evidence
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs circuitsleuth-check 2>/dev/null || true
          docker rm -f circuitsleuth-check 2>/dev/null || true
